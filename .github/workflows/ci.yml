name: Test and security smoke checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e '.[web,dev]'
      - name: Run automated tests
        run: python -m pytest -q
      - name: Python compilation smoke check
        run: python -m compileall -q src
      - name: CLI version check
        run: releaselab doctor
