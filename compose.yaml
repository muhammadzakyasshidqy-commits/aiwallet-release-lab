services:
  release-lab:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - release_reports:/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g

volumes:
  release_reports:
