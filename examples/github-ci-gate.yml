# Example for a repo that has already checked out AIWallet Release Lab
# and placed demo/export.mp4 in the workspace.
name: Release video technical gate
on:
  workflow_dispatch:
  push:
    paths:
      - 'demo/*.mp4'
jobs:
  video_qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run release gate
        uses: ./
        with:
          video: demo/export.mp4
          fail-on: warn
