name: 'AIWallet Release Lab Gate'
description: 'Local technical QC gate for a video export (not platform approval).'
author: 'AIWallet Studio'
branding:
  icon: 'check-circle'
  color: 'green'
inputs:
  video:
    description: 'Path to a video export in the workspace'
    required: true
  fail-on:
    description: 'warn (strict), fail, or none'
    required: false
    default: 'warn'
  quick:
    description: 'Metadata-only check; skip audio and frame scans (NOT adequate for strict release gate)'
    required: false
    default: 'false'
  policy:
    description: 'Optional checked-in JSON studio policy path'
    required: false
    default: ''
  editorial-review:
    description: "Optional reviewer JSON bound to the exact source SHA-256; must be approved to pass"
    required: false
    default: ""
runs:
  using: 'composite'
  steps:
    - name: Verify local tools
      shell: bash
      run: |
        command -v python3
        command -v ffmpeg
        command -v ffprobe
    - name: Install Release Lab from this checkout
      shell: bash
      run: python -m pip install .
    - name: Quality gate
      shell: bash
      env:
        RELEASE_INPUT_VIDEO: ${{ inputs.video }}
        RELEASE_FAIL_ON: ${{ inputs.fail-on }}
        RELEASE_QUICK: ${{ inputs.quick }}
        RELEASE_POLICY: ${{ inputs.policy }}
        RELEASE_EDITORIAL_REVIEW: ${{ inputs.editorial-review }}
      run: |
        args=(gate "$RELEASE_INPUT_VIDEO" --fail-on "$RELEASE_FAIL_ON")
        if [ "$RELEASE_QUICK" = 'true' ]; then args+=(--quick); fi
        if [ -n "$RELEASE_POLICY" ]; then args+=(--policy "$RELEASE_POLICY"); fi
        if [ -n "$RELEASE_EDITORIAL_REVIEW" ]; then args+=(--editorial-review "$RELEASE_EDITORIAL_REVIEW"); fi
        releaselab "${args[@]}"
