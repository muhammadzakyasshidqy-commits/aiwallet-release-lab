[build-system]
requires = ["setuptools>=70,<81", "wheel>=0.42,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "aiwallet-release-lab"
version = "0.4.0"
description = "Local-first, explainable QC and release reports for vertical video."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "AIWallet Studio"}]
keywords = ["ffmpeg", "video-quality-control", "reels", "shorts", "tiktok", "open-source", "local-first"]
classifiers = ["Development Status :: 3 - Alpha", "Environment :: Console", "Programming Language :: Python :: 3", "Topic :: Multimedia :: Video"]
dependencies = []

[project.optional-dependencies]
web = ["fastapi==0.128.2", "uvicorn==0.48.0", "python-multipart==0.0.29"]
dev = ["pytest==9.0.2", "httpx==0.28.1"]

[project.scripts]
releaselab = "aiwallet_release_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiwallet_release_lab = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
